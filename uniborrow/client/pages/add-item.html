<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item — UniBorrow</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages.css">
    
</head>
<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="index.html" class="logo">UniBorrow</a>
            <nav class="nav-links">
                <a href="browse.html">Browse</a>
                <a href="my-items.html">My Items</a>
                <a href="my-borrowings.html">My Borrowings</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-button" aria-label="Notifications">♡</button>
                <a href="login.html" style="font-size:14px;color:var(--text-secondary);">Log In</a>
                <a href="profile.html" class="profile-button">Profile</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" style="padding:48px 0 90px;">
            <div class="page-header" style="padding-top:0;">
                <span class="section-label">My Items</span>
                <h1>Add an Item</h1>
            </div>
            <div class="form-card">
                <form id="addItemForm">
                    <div class="field">
                        <label for="itemName">Item Name</label>
                        <input type="text" id="itemName" placeholder="e.g. HDMI Cable" required>
                    </div>
                    <div class="field">
                        <label for="itemCategory">Category</label>
                        <select id="itemCategory">
                            <option>Books</option>
                            <option>Electronics</option>
                            <option>Tools</option>
                            <option>Equipment</option>
                            <option>Sports</option>
                            <option>Others</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="itemDesc">Description</label>
                        <textarea id="itemDesc" placeholder="อธิบายของที่จะให้ยืม..."></textarea>
                    </div>
                    <div class="field">
                        <label>Upload Image</label>
                        <div class="upload-box">คลิกเพื่ออัปโหลดรูปภาพ หรือลากไฟล์มาวางที่นี่</div>
                    </div>
                    <div class="field">
                        <label for="itemAvail">Availability</label>
                        <input type="text" id="itemAvail" placeholder="e.g. Today – Sep 10">
                    </div>
                    <button type="submit" class="full-button">Add Item</button>
                </form>
            </div>
        </div>

    </main>
    <footer class="footer">
        <div class="container footer-inner">
            <div>
                <strong>UniBorrow</strong>
                <p>Campus Item Sharing Platform</p>
            </div>
            <span>© 2026 UniBorrow</span>
        </div>
    </footer>

    <script src="../js/items.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
