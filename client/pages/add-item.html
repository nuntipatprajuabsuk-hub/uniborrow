<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBorrow - ลงประกาศสิ่งของ</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <a href="browse.html">UniBorrow</a>
    </div>
    <nav class="nav-links">
      <a href="browse.html">ค้นหาสิ่งของ</a>
      <div id="user-status" style="display: inline-flex; gap: 15px; align-items: center;"></div>
    </nav>
  </header>

  <main class="container" style="max-width: 600px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2>ลงประกาศยืมสิ่งของ</h2>
    
    <form id="add-item-form">
      <div style="margin-bottom: 15px;">
        <label for="item-title" style="display: block; margin-bottom: 5px;">ชื่อสิ่งของ</label>
        <input type="text" id="item-title" required placeholder="เช่น หนังสือเรียน Calculus I" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>
      
      <div style="margin-bottom: 15px;">
        <label for="item-category" style="display: block; margin-bottom: 5px;">หมวดหมู่</label>
        <select id="item-category" required style="width: 100%; padding: 8px; box-sizing: border-box;">
          <option value="หนังสือ">หนังสือ</option>
          <option value="อุปกรณ์ถ่ายภาพ">อุปกรณ์ถ่ายภาพ</option>
          <option value="เครื่องใช้ไฟฟ้า">เครื่องใช้ไฟฟ้า</option>
          <option value="เครื่องมือช่าง">เครื่องมือช่าง</option>
          <option value="การเรียน">การเรียน</option>
          <option value="อุปกรณ์ไอที">อุปกรณ์ไอที</option>
        </select>
      </div>

      <div style="margin-bottom: 20px;">
        <label for="item-desc" style="display: block; margin-bottom: 5px;">รายละเอียดสิ่งของ</label>
        <textarea id="item-desc" rows="4" required placeholder="ระบุสภาพของ ตำแหน่งที่สะดวกนัดรับส่ง..." style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
      </div>

      <button type="submit" style="width: 100%; background: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">ลงประกาศ</button>
    </form>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/items.js"></script>
</body>
</html>
