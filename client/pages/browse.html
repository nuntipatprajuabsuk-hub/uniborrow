<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBorrow - รายการสิ่งของทั้งหมด</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <a href="browse.html">UniBorrow</a>
    </div>
    <nav class="nav-links">
      <a href="browse.html">ค้นหาสิ่งของ</a>
      <!-- จุดแสดงสถานะ Login/User Info -->
      <div id="user-status" style="display: inline-flex; gap: 15px; align-items: center;"></div>
    </nav>
  </header>

  <main class="container" style="padding: 20px;">
    <h2>รายการสิ่งของที่เปิดให้ยืม</h2>
    
    <!-- แถบ ค้นหา และ กรองหมวดหมู่ -->
    <div class="filter-bar" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="search" id="search-input" placeholder="ค้นหาชื่อสิ่งของ หรือ รายละเอียด..." style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <select id="category-filter" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        <option value="all">ทุกหมวดหมู่</option>
        <option value="หนังสือ">หนังสือ</option>
        <option value="อุปกรณ์ถ่ายภาพ">อุปกรณ์ถ่ายภาพ</option>
        <option value="เครื่องใช้ไฟฟ้า">เครื่องใช้ไฟฟ้า</option>
        <option value="เครื่องมือช่าง">เครื่องมือช่าง</option>
        <option value="การเรียน">การเรียน</option>
        <option value="อุปกรณ์ไอที">อุปกรณ์ไอที</option>
      </select>
    </div>

    <!-- รายการการ์ดสิ่งของจะถูกวาดที่นี่ -->
    <div id="item-list" class="item-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;">
      <!-- JS จะวาดข้อมูลตรงนี้ -->
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/items.js"></script>
</body>
</html>
