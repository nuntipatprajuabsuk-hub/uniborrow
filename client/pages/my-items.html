<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Items — UniBorrow</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages.css">
    
</head>
<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="index.html" class="logo">UniBorrow</a>
            <nav class="nav-links">
                <a href="browse.html">Browse</a>
                <a href="my-items.html">My Items</a>
                <a href="my-borrowings.html">My Borrowings</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-button" aria-label="Notifications">♡</button>
                <a href="login.html" style="font-size:14px;color:var(--text-secondary);">Log In</a>
                <a href="profile.html" class="profile-button">Profile</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" style="padding:48px 0 90px;">
            <div class="section-header" style="align-items:center;">
                <div>
                    <span class="section-label">My Items</span>
                    <h1 style="margin-top:6px;font-size:30px;letter-spacing:-0.8px;">Items you're lending</h1>
                </div>
                <a href="add-item.html" class="primary-button">+ Add Item</a>
            </div>
            <div style="max-width:640px;">
            <div class="list-row">
                <div class="list-row-thumb"><img src="../img/hdmi.svg" alt="HDMI Cable"></div>
                <div class="list-row-info">
                    <h4>HDMI Cable</h4>
                    <span>Available</span>
                </div>
                <div class="list-row-action"><button class="small-button">Manage</button></div>
            </div>
            <div class="list-row">
                <div class="list-row-thumb"><img src="../img/calculator.svg" alt="Scientific Calculator"></div>
                <div class="list-row-info">
                    <h4>Scientific Calculator</h4>
                    <span>Available</span>
                </div>
                <div class="list-row-action"><button class="small-button">Manage</button></div>
            </div>
            <div class="list-row">
                <div class="list-row-thumb"><img src="../img/tripod.svg" alt="Camera Tripod"></div>
                <div class="list-row-info">
                    <h4>Camera Tripod</h4>
                    <span>Currently Borrowed</span>
                </div>
                <div class="list-row-action"><button class="small-button">Manage</button></div>
            </div>
            <div class="list-row">
                <div class="list-row-thumb"><img src="../img/drill.svg" alt="Electric Drill"></div>
                <div class="list-row-info">
                    <h4>Electric Drill</h4>
                    <span>Available</span>
                </div>
                <div class="list-row-action"><button class="small-button">Manage</button></div>
            </div>
            </div>
        </div>

    </main>
    <footer class="footer">
        <div class="container footer-inner">
            <div>
                <strong>UniBorrow</strong>
                <p>Campus Item Sharing Platform</p>
            </div>
            <span>© 2026 UniBorrow</span>
        </div>
    </footer>

    <script src="../js/items.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
