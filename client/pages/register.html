<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBorrow - สมัครสมาชิก</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <a href="browse.html">UniBorrow</a>
    </div>
    <nav class="nav-links">
      <a href="browse.html">ค้นหาสิ่งของ</a>
      <div id="user-status" style="display: inline-flex; gap: 15px; align-items: center;"></div>
    </nav>
  </header>

  <main class="container" style="max-width: 400px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2 style="text-align: center;">สมัครสมาชิก</h2>
    
    <form id="register-form">
      <div style="margin-bottom: 15px;">
        <label for="name" style="display: block; margin-bottom: 5px;">ชื่อ - นามสกุล</label>
        <input type="text" id="name" required placeholder="สมชาย ใจดี" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label for="email" style="display: block; margin-bottom: 5px;">อีเมลนักศึกษา</label>
        <input type="email" id="email" required placeholder="example@student.ac.th" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 20px;">
        <label for="password" style="display: block; margin-bottom: 5px;">รหัสผ่าน</label>
        <input type="password" id="password" required style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <button type="submit" style="width: 100%; background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">ยืนยันสมัครสมาชิก</button>
    </form>
    
    <p style="text-align: center; margin-top: 15px; font-size: 14px;">
      มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
    </p>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/items.js"></script>
</body>
</html>
