<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — UniBorrow</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages.css">
    
</head>
<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="index.html" class="logo">UniBorrow</a>
            <nav class="nav-links">
                <a href="browse.html">Browse</a>
                <a href="my-items.html">My Items</a>
                <a href="my-borrowings.html">My Borrowings</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-button" aria-label="Notifications">♡</button>
                <a href="login.html" style="font-size:14px;color:var(--text-secondary);">Log In</a>
                <a href="profile.html" class="profile-button">Profile</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container auth-wrap">
            <div class="form-card">
                <span class="section-label">Join UniBorrow</span>
                <h1 style="margin-top:8px;font-size:26px;letter-spacing:-0.6px;">Create your account</h1>
                <p style="color:var(--text-secondary);font-size:14px;margin-top:8px;margin-bottom:28px;">
                    ต้องใช้อีเมลมหาวิทยาลัยเท่านั้น
                </p>
                <form id="registerForm">
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Tawan S." required>
                    </div>
                    <div class="field">
                        <label for="regEmail">University Email</label>
                        <input type="email" id="regEmail" placeholder="[email protected]" required>
                    </div>
                    <div class="field">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="full-button">Create Account</button>
                </form>
                <p class="form-note">มีบัญชีอยู่แล้ว? <a href="login.html" style="color:var(--accent);">เข้าสู่ระบบ</a></p>
            </div>
        </div>

    </main>
    <footer class="footer">
        <div class="container footer-inner">
            <div>
                <strong>UniBorrow</strong>
                <p>Campus Item Sharing Platform</p>
            </div>
            <span>© 2026 UniBorrow</span>
        </div>
    </footer>

    <script src="../js/items.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
